<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧旅游规划小助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
            background-size: 400% 400%;
            animation: gradientShift 15s ease infinite;
            opacity: 0.5;
            z-index: 0;
            pointer-events: none;
        }
        
        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }
        
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .header h1 {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        .form-section {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            margin-bottom: 30px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 10px;
            font-size: 14px;
            transition: all 0.3s ease;
        }
        
        .form-group input:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.2);
        }
        
        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }
        
        .api-key-group {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .api-key-group .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        .test-btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            white-space: nowrap;
        }
        
        .test-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .test-btn.success {
            background: linear-gradient(135deg, #10b981, #059669);
        }
        
        .test-btn.error {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }
        
        .submit-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 15px 40px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            margin-top: 10px;
        }
        
        .submit-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        
        .submit-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #ef4444;
            font-size: 12px;
            margin-top: 5px;
        }
        
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        
        .loading-content {
            background: white;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
        }
        
        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .result-section {
            display: none;
        }
        
        .weather-card {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.9), rgba(37, 99, 235, 0.9));
            border-radius: 20px;
            padding: 25px;
            color: white;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
        }
        
        .weather-card h2 {
            margin-bottom: 20px;
        }
        
        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }
        
        .weather-item {
            background: rgba(255, 255, 255, 0.2);
            padding: 15px;
            border-radius: 15px;
            text-align: center;
        }
        
        .weather-date {
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .weather-temp {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        
        .weather-desc {
            font-size: 14px;
        }
        
        .tips-section {
            background: rgba(255, 255, 255, 0.88);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .tips-section h2 {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 15px;
        }
        
        .tips-list {
            list-style: none;
        }
        
        .tips-list li {
            padding: 10px 0;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
            display: flex;
            align-items: center;
        }
        
        .tips-list li:last-child {
            border-bottom: none;
        }
        
        .tips-list li::before {
            content: '💡';
            margin-right: 10px;
            font-size: 18px;
        }
        
        .day-card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .day-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            gap: 15px;
        }
        
        .day-badge {
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-weight: 700;
            font-size: 18px;
        }
        
        .day-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
        }
        
        .day-date {
            color: #666;
            font-size: 14px;
        }
        
        .spots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        
        @media (max-width: 900px) {
            .spots-grid {
                grid-template-columns: 1fr;
            }
        }
        
        .spot-card {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        
        .spot-card:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-5px);
        }
        
        .spot-number {
            display: inline-block;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            text-align: center;
            line-height: 28px;
            color: white;
            font-weight: 600;
            margin-bottom: 10px;
        }
        
        .spot-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        
        .spot-address {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .schedule-item {
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(102, 126, 234, 0.05);
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .schedule-time {
            font-weight: 600;
            color: #667eea;
            min-width: 60px;
        }
        
        .schedule-info {
            flex: 1;
        }
        
        .schedule-name {
            font-weight: 600;
            color: #333;
        }
        
        .schedule-detail {
            font-size: 12px;
            color: #666;
        }
        
        .rec-section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .rec-section h2 {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        
        .rec-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }
        
        .rec-item {
            background: rgba(102, 126, 234, 0.05);
            border-radius: 15px;
            padding: 15px;
            transition: all 0.3s ease;
        }
        
        .rec-item:hover {
            background: rgba(102, 126, 234, 0.1);
            transform: translateY(-5px);
        }
        
        .rec-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }
        
        .rec-rating {
            display: inline-block;
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: white;
            padding: 3px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .rec-address {
            font-size: 12px;
            color: #666;
        }
        
        .map-section {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .map-section h2 {
            background: linear-gradient(90deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        
        .map-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .map-tab {
            padding: 10px 20px;
            background: rgba(102, 126, 234, 0.1);
            border: 2px solid rgba(102, 126, 234, 0.3);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        
        .map-tab:hover {
            background: rgba(102, 126, 234, 0.2);
        }
        
        .map-tab.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
        }
        
        .map-description {
            margin-bottom: 15px;
            color: #666;
        }
        
        .map-actions {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .map-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }
        
        .map-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }
        
        .map-iframe {
            width: 100%;
            height: 500px;
            border: none;
            border-radius: 15px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI旅游规划助手</h1>
            <p>输入您的旅行信息，获取智能规划方案</p>
        </div>
        
        <div class="form-section">
            <form id="travelForm">
                <div class="api-key-group">
                    <div class="form-group">
                        <label for="apiKey">高德地图API Key *</label>
                        <input type="text" id="apiKey" name="apiKey" placeholder="请输入您的高德地图API Key" required>
                        <div id="keyError" class="error-message"></div>
                    </div>
                    <button type="button" id="testKeyBtn" class="test-btn">测试连接</button>
                </div>
                
                <div class="form-row" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="city">目的地城市 *</label>
                        <input type="text" id="city" name="city" placeholder="例如：北京" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="travelDate">出行日期 *</label>
                        <input type="date" id="travelDate" name="travelDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="days">出行天数</label>
                        <input type="number" id="days" name="days" min="1" max="7" value="5" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="spotsPerDay">每天游玩景点数</label>
                        <input type="number" id="spotsPerDay" name="spotsPerDay" min="1" max="3" value="3" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="planType">方案类型</label>
                        <select id="planType" name="planType" style="width:100%;padding:12px;border:2px solid rgba(102,126,234,0.3);border-radius:10px;font-size:14px;">
                            <option value="classic">经典必游（热门景点）</option>
                            <option value="cultural">文化深度（博物馆古迹）</option>
                            <option value="nature">自然风光（山水湖泊）</option>
                            <option value="relax">休闲放松（公园广场）</option>
                            <option value="balanced">均衡推荐（混合类型）</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn" disabled>生成旅行方案</button>
            </form>
        </div>
        
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p>正在智能规划中，请稍候...</p>
            </div>
        </div>
        
        <div class="result-section" id="resultSection">
            <div id="resultContent"></div>
        </div>
    </div>
    
    <script>
        let keyTested = false;
        let currentApiKey = '';
        
        function setDefaultDate() {
            const today = new Date();
            const tomorrow = new Date(today);
            tomorrow.setDate(tomorrow.getDate() + 1);
            
            const dateInput = document.getElementById('travelDate');
            const minDate = today.toISOString().split('T')[0];
            const defaultDate = tomorrow.toISOString().split('T')[0];
            
            dateInput.min = minDate;
            dateInput.value = defaultDate;
        }
        
        setDefaultDate();
        
        document.getElementById('apiKey').addEventListener('input', function() {
            const key = this.value.trim();
            if (key !== currentApiKey) {
                keyTested = false;
                currentApiKey = key;
                const testBtn = document.getElementById('testKeyBtn');
                testBtn.textContent = '测试连接';
                testBtn.className = 'test-btn';
                document.getElementById('keyError').textContent = '';
                document.getElementById('submitBtn').disabled = true;
            }
        });
        
        document.getElementById('testKeyBtn').addEventListener('click', async function() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const testBtn = this;
            const keyError = document.getElementById('keyError');
            
            if (!apiKey) {
                keyError.textContent = '请输入API Key';
                return;
            }
            
            testBtn.disabled = true;
            testBtn.textContent = '测试中...';
            keyError.textContent = '';
            
            try {
                const response = await fetch('/test_key', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ api_key: apiKey })
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    testBtn.textContent = '测试通过';
                    testBtn.className = 'test-btn success';
                    keyTested = true;
                    document.getElementById('submitBtn').disabled = false;
                } else {
                    testBtn.textContent = '测试失败';
                    testBtn.className = 'test-btn error';
                    keyError.textContent = result.message || 'API Key无效';
                    keyTested = false;
                }
            } catch (error) {
                testBtn.textContent = '测试失败';
                testBtn.className = 'test-btn error';
                keyError.textContent = '网络错误，请重试';
                keyTested = false;
            } finally {
                testBtn.disabled = false;
            }
        });
        
        document.getElementById('travelForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!keyTested) {
                alert('请先测试API Key连接');
                return;
            }
            
            const days = parseInt(document.getElementById('days').value);
            const spotsPerDay = parseInt(document.getElementById('spotsPerDay').value);
            
            if (days < 1 || days > 7) {
                alert('出行天数需在1-7之间');
                return;
            }
            
            if (spotsPerDay < 1 || spotsPerDay > 3) {
                alert('每天游玩景点数需在1-3之间');
                return;
            }
            
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            document.getElementById('loadingOverlay').style.display = 'flex';
            
            const formData = {
                api_key: document.getElementById('apiKey').value.trim(),
                city: document.getElementById('city').value.trim(),
                start_date: document.getElementById('travelDate').value,
                days: days,
                spots_per_day: spotsPerDay,
                plan_type: document.getElementById('planType').value
            };
            
            try {
                const response = await fetch('/plan', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });
                
                const result = await response.json();
                
                if (result.ok) {
                    renderResult(result);
                    document.getElementById('resultSection').style.display = 'block';
                } else {
                    alert(result.message || '规划失败，请重试');
                }
            } catch (error) {
                alert('网络错误，请重试');
            } finally {
                submitBtn.disabled = false;
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        });
        
        function renderResult(data) {
            const content = document.getElementById('resultContent');
            const dayColors = [
                { bg: 'linear-gradient(135deg, #667eea, #764ba2)', color: '#667eea' },
                { bg: 'linear-gradient(135deg, #f093fb, #f5576c)', color: '#f093fb' },
                { bg: 'linear-gradient(135deg, #4facfe, #00f2fe)', color: '#4facfe' },
                { bg: 'linear-gradient(135deg, #43e97b, #38f9d7)', color: '#43e97b' },
                { bg: 'linear-gradient(135deg, #fa709a, #fee140)', color: '#fa709a' },
                { bg: 'linear-gradient(135deg, #a18cd1, #fbc2eb)', color: '#a18cd1' },
                { bg: 'linear-gradient(135deg, #ff9a9e, #fecfef)', color: '#ff9a9e' }
            ];
            
            let html = '';
            
            html += `
                <div class="weather-card">
                    <h2>🌤️ ${data.city} 天气预报</h2>
                    <div class="weather-grid">
                        ${data.weather.map(w => `
                            <div class="weather-item">
                                <div class="weather-date">${w.date}</div>
                                <div class="weather-temp">${w.daytemp}°C / ${w.nighttemp}°C</div>
                                <div class="weather-desc">${w.dayweather}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
            
            if (data.travel_tips && data.travel_tips.length > 0) {
                html += `
                    <div class="tips-section">
                        <h2>💡 出行小贴士</h2>
                        <ul class="tips-list">
                            ${data.travel_tips.map(tip => `<li>${tip}</li>`).join('')}
                        </ul>
                    </div>
                `;
            }
            
            data.daily_plans.forEach((day, idx) => {
                const colorIdx = idx % dayColors.length;
                const color = dayColors[colorIdx];
                
                html += `
                    <div class="day-card">
                        <div class="day-header">
                            <div class="day-badge" style="background: ${color.bg};">D${day.day}</div>
                            <div>
                                <div class="day-title">第${day.day}天行程</div>
                                <div class="day-date">${day.date} · ${day.weather.dayweather} ${day.weather.daytemp}°C</div>
                            </div>
                        </div>
                        
                        <div class="spots-grid">
                            ${day.spots.map((spot, i) => `
                                <div class="spot-card">
                                    ${spot.photo ? `<img src="${spot.photo}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-bottom:10px;" onerror="this.style.display='none'">` : ''}
                                    <div class="spot-number" style="background: ${color.bg};">${i + 1}</div>
                                    <div class="spot-name">${spot.name}</div>
                                    <div class="spot-address">${spot.address || '暂无地址'}</div>
                                </div>
                            `).join('')}
                        </div>
                        
                        <div class="schedule-list">
                            ${day.schedule.map((item, i) => `
                                <div class="schedule-item">
                                    <div class="schedule-time">${item.time}</div>
                                    <div class="schedule-info">
                                        <div class="schedule-name">${item.spot.name}</div>
                                        <div class="schedule-detail">
                                            游览${item.visit_hours}小时 · 
                                            ${i === 0 ? '出发' : `打车${item.travel_time} · 约${item.taxi_cost}元`}
                                        </div>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            });
            
            if (data.food_recommendations && data.food_recommendations.length > 0) {
                html += `
                    <div class="rec-section">
                        <h2>🍜 美食推荐</h2>
                        <div class="rec-grid">
                            ${data.food_recommendations.map(food => `
                                <div class="rec-item">
                                    ${food.photo ? `<img src="${food.photo}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:10px;" onerror="this.style.display='none'">` : ''}
                                    <div class="rec-name">${food.name}</div>
                                    ${food.rating ? `<div class="rec-rating">⭐ ${food.rating}</div>` : ''}
                                    <div class="rec-address">${food.address || '暂无地址'}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            if (data.hotel_recommendations && data.hotel_recommendations.length > 0) {
                html += `
                    <div class="rec-section">
                        <h2>🏨 住宿推荐</h2>
                        <div class="rec-grid">
                            ${data.hotel_recommendations.map(hotel => `
                                <div class="rec-item">
                                    ${hotel.photo ? `<img src="${hotel.photo}" style="width:100%;height:150px;object-fit:cover;border-radius:10px;margin-bottom:10px;" onerror="this.style.display='none'">` : ''}
                                    <div class="rec-name">${hotel.name}</div>
                                    ${hotel.rating ? `<div class="rec-rating">⭐ ${hotel.rating}</div>` : ''}
                                    <div class="rec-address">${hotel.address || '暂无地址'}</div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            
            html += `
                <div class="map-section">
                    <h2>🗺️ 路线地图</h2>
                    <div class="map-tabs" id="mapTabs">
                        ${data.daily_plans.map((day, idx) => {
                            const spots = day.spots_names || day.spots.map(s => s.name);
                            const routeText = spots.slice(0, 3).join(' → ');
                            return `<div class="map-tab ${idx === 0 ? 'active' : ''}" data-day="${idx}">第${day.day}天 ${routeText}</div>`;
                        }).join('')}
                    </div>
                    <div class="map-description" id="mapDescription"></div>
                    <div class="map-actions">
                        <a href="#" target="_blank" class="map-btn" id="navLink">查看驾车导航</a>
                        <a href="#" target="_blank" class="map-btn" id="taxiLink">一键打车</a>
                    </div>
                    <iframe id="mapIframe" class="map-iframe" src=""></iframe>
                </div>
            `;
            
            content.innerHTML = html;
            
            const mapData = data.daily_plans.map(day => ({
                url: day.map_url,
                spots: day.spots.map(s => s.name)
            }));
            
            function updateMap(dayIdx) {
                const mapInfo = mapData[dayIdx];
                if (mapInfo && mapInfo.url) {
                    document.getElementById('mapIframe').src = mapInfo.url;
                    document.getElementById('navLink').href = mapInfo.url;
                    document.getElementById('taxiLink').href = mapInfo.url;
                    document.getElementById('mapDescription').textContent = 
                        `路线：${mapInfo.spots.join(' → ')}`;
                }
            }
            
            document.querySelectorAll('.map-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    document.querySelectorAll('.map-tab').forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    updateMap(parseInt(this.dataset.day));
                });
            });
            
            if (mapData.length > 0 && mapData[0].url) {
                updateMap(0);
            }
        }
    </script>
</body>
</html>
