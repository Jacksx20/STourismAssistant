<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧旅游规划小助手</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AI旅游规划助手</h1>
            <p>输入您的旅行信息，获取智能规划方案</p>
        </div>
        
        <div class="form-section">
            <form id="travelForm">
                <div class="api-key-group">
                    <div class="form-group">
                        <label for="apiKey">高德地图API Key *</label>
                        <input type="text" id="apiKey" name="apiKey" placeholder="请输入您的高德地图API Key" required>
                        <div id="keyError" class="error-message"></div>
                    </div>
                    <button type="button" id="testKeyBtn" class="test-btn">测试连接</button>
                </div>
                
                <div class="form-row" style="margin-top: 20px;">
                    <div class="form-group">
                        <label for="city">目的地城市 *</label>
                        <input type="text" id="city" name="city" placeholder="例如：北京" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="travelDate">出行日期 *</label>
                        <input type="date" id="travelDate" name="travelDate" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="days">出行天数</label>
                        <input type="number" id="days" name="days" min="1" max="7" value="5" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="spotsPerDay">每天游玩景点数</label>
                        <input type="number" id="spotsPerDay" name="spotsPerDay" min="1" max="5" value="3" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="planType">方案类型</label>
                        <select id="planType" name="planType" style="width:100%;padding:12px;border:2px solid rgba(102,126,234,0.3);border-radius:10px;font-size:14px;">
                            <option value="classic">经典必游（热门景点）</option>
                            <option value="cultural">文化深度（博物馆古迹）</option>
                            <option value="nature">自然风光（山水湖泊）</option>
                            <option value="relax">休闲放松（公园广场）</option>
                            <option value="balanced">均衡推荐（混合类型）</option>
                        </select>
                    </div>
                </div>
                
                <button type="submit" id="submitBtn" class="submit-btn" disabled>生成旅行方案</button>
            </form>
        </div>
        
        <div class="loading-overlay" id="loadingOverlay">
            <div class="loading-content">
                <div class="loading-spinner"></div>
                <p class="loading-text">正在智能规划中，请稍候...</p>
                <div class="loading-progress-bar">
                    <div class="loading-progress-fill" id="progressFill"></div>
                </div>
                <div class="loading-progress-info">
                    <span id="progressPercent">0%</span>
                    <span id="progressTime">预计剩余 --</span>
                </div>
                <div class="loading-step" id="progressStep"></div>
            </div>
        </div>
        
        <div class="result-section" id="resultSection">
            <div id="resultContent"></div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
